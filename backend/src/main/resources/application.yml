server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:sqlite:${SMS_DATA_DIR:/data}/sms-simulator.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

sms:
  retention:
    enabled: ${SMS_RETENTION_ENABLED:true}
    days: ${SMS_RETENTION_DAYS:1}
  max-messages: ${SMS_MAX_MESSAGES:10000}
